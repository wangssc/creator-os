<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>卡片渲染</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #wrap { width: 100%; }
  #card { display: block; width: 100%; height: auto; }
  #tip {
    font: 14px/1.7 "Microsoft YaHei", "微软雅黑", sans-serif;
    color: #6B7280;
    padding: 28px;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="card" width="1080" height="1440"></canvas></div>
<div id="tip" style="display:none"></div>
<script>
/* ============================================================
   贴图卡片 Canvas 渲染器
   画布固定 1080 x 1440，底部 15% 为落款区
   ============================================================ */

var W = 1080;
var H = 1440;
var FOOTER_H = Math.round(H * 0.15);      // 216，落款区高度
var CONTENT_H = H - FOOTER_H;             // 1224，内容区底边
var PAD = 96;                             // 安全边距
var FONT = '"Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif';

var C = {
  white: "#FFFFFF",
  light: "#F0FDF4",
  light2: "#DCFCE7",
  green: "#16A34A",
  greenDeep: "#15803D",
  ink: "#14261C",
  gray: "#5B6B62",
  line: "#E5E7EB",
  dark: "#14261C",
  darkLine: "#2C4034",
  onDark: "#F0FDF4",
  onDarkSub: "#A7B5AC"
};

var currentCard = null;
var currentMeta = { theme: "", index: 1, total: 1 };

function getCanvas() {
  return document.getElementById("card");
}

/* 逐字折行：按渲染宽度折，不截断、不丢字，中英文混排都正确 */
function wrapLines(ctx, text, maxWidth) {
  var lines = [];
  var line = "";
  var chars = Array.from(String(text == null ? "" : text));
  for (var i = 0; i < chars.length; i++) {
    var ch = chars[i];
    if (ch === "\n") {
      lines.push(line);
      line = "";
      continue;
    }
    var test = line + ch;
    if (line && ctx.measureText(test).width > maxWidth) {
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines.length ? lines : [""];
}

/* 标题自适应：行数超出就缩字号，直到放进 maxLines 行 */
function fitTitle(ctx, text, maxWidth, maxLines, baseSize, minSize) {
  var size = baseSize;
  while (size > minSize) {
    ctx.font = "700 " + size + "px " + FONT;
    var lines = wrapLines(ctx, text, maxWidth);
    if (lines.length <= maxLines) return { size: size, lines: lines };
    size -= 4;
  }
  ctx.font = "700 " + minSize + "px " + FONT;
  return { size: minSize, lines: wrapLines(ctx, text, maxWidth) };
}

function drawLines(ctx, lines, x, y, size, lineHeight, color, align) {
  ctx.fillStyle = color;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "top";
  ctx.font = "700 " + size + "px " + FONT;
  for (var i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], x, y + i * size * lineHeight);
  }
  return y + lines.length * size * lineHeight;
}

function drawParagraph(ctx, text, x, y, size, lineHeight, color, align, maxWidth) {
  ctx.font = "400 " + size + "px " + FONT;
  ctx.fillStyle = color;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "top";
  var lines = wrapLines(ctx, text, maxWidth);
  for (var i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], x, y + i * size * lineHeight);
  }
  return y + lines.length * size * lineHeight;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* 底部落款区：一条细线 + 品牌名，深色卡片自动反白 */
function drawFooter(ctx, dark) {
  var lineColor = dark ? C.darkLine : C.line;
  var brandColor = dark ? "#86EFAC" : C.green;
  var subColor = dark ? "#6B7F73" : "#9CA3AF";

  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(PAD, CONTENT_H + 34);
  ctx.lineTo(W - PAD, CONTENT_H + 34);
  ctx.stroke();

  ctx.fillStyle = brandColor;
  ctx.fillRect(PAD, CONTENT_H + 88, 14, 14);

  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.font = "600 28px " + FONT;
  ctx.fillStyle = brandColor;
  ctx.fillText("宇宙第一工作台", PAD + 30, CONTENT_H + 96);

  ctx.textAlign = "right";
  ctx.font = "400 22px " + FONT;
  ctx.fillStyle = subColor;
  ctx.fillText("CREATOR OS", W - PAD, CONTENT_H + 96);
}

/* ---------------- 8 种版式 ---------------- */

function bgFill(ctx, color) {
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, W, H);
}

function layoutBigCenter(ctx, card) {
  bgFill(ctx, C.white);

  // 顶部装饰短条
  ctx.fillStyle = C.green;
  ctx.fillRect(PAD, PAD, 72, 10);

  var maxW = W - PAD * 2;
  var fit = fitTitle(ctx, card.title, maxW, 3, 92, 60);
  var blockH = fit.lines.length * fit.size * 1.28;
  var startY = (CONTENT_H - blockH) / 2 - 40;

  drawLines(ctx, fit.lines, W / 2, startY, fit.size, 1.28, C.ink, "center");

  if (card.sub) {
    drawParagraph(ctx, card.sub, W / 2, startY + blockH + 56, 36, 1.7, C.gray, "center", maxW - 120);
  }

  drawFooter(ctx, false);
}

function layoutThreeRow(ctx, card) {
  bgFill(ctx, C.light);

  ctx.fillStyle = C.ink;
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.font = "700 40px " + FONT;
  ctx.fillText(card.title || "", PAD, PAD);

  var rows = (card.items || []).slice(0, 3);
  if (rows.length < 3 && card.sub) rows.push(card.sub);
  while (rows.length < 3) rows.push("");

  var top = 320;
  var gap = (CONTENT_H - top - 80) / 3;

  for (var i = 0; i < 3; i++) {
    var y = top + i * gap;
    // 序号
    ctx.fillStyle = C.green;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.font = "700 44px " + FONT;
    ctx.fillText("0" + (i + 1), PAD, y);

    // 文字
    var fit = fitTitle(ctx, rows[i], W - PAD * 2 - 120, 2, 46, 32);
    drawLines(ctx, fit.lines, PAD + 110, y, fit.size, 1.35, C.ink, "left");

    if (i < 2) {
      ctx.strokeStyle = "#D7E8DC";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(PAD, y + gap - 46);
      ctx.lineTo(W - PAD, y + gap - 46);
      ctx.stroke();
    }
  }

  drawFooter(ctx, false);
}

function layoutQuadGrid(ctx, card) {
  bgFill(ctx, C.white);

  ctx.fillStyle = C.ink;
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.font = "700 40px " + FONT;
  ctx.fillText(card.title || "", PAD, PAD);

  var items = (card.items || []).slice(0, 4);
  if (items.length < 4 && card.sub) items.push(card.sub);
  while (items.length < 4) items.push("");

  var gap = 28;
  var cellW = (W - PAD * 2 - gap) / 2;
  var cellH = (CONTENT_H - 260 - 80 - gap) / 2;
  var top = 260;

  for (var i = 0; i < 4; i++) {
    var col = i % 2;
    var row = Math.floor(i / 2);
    var x = PAD + col * (cellW + gap);
    var y = top + row * (cellH + gap);

    ctx.fillStyle = C.light;
    roundRect(ctx, x, y, cellW, cellH, 20);
    ctx.fill();

    ctx.fillStyle = C.green;
    ctx.fillRect(x + 32, y + 32, 40, 6);

    var fit = fitTitle(ctx, items[i], cellW - 72, 3, 38, 26);
    var th = fit.lines.length * fit.size * 1.4;
    drawLines(ctx, fit.lines, x + 36, y + (cellH - th) / 2 + 20, fit.size, 1.4, C.ink, "left");
  }

  drawFooter(ctx, false);
}

function layoutDarkReverse(ctx, card) {
  bgFill(ctx, C.dark);

  ctx.fillStyle = C.green;
  ctx.fillRect(PAD, PAD, 72, 10);

  var maxW = W - PAD * 2;
  var fit = fitTitle(ctx, card.title, maxW, 3, 96, 62);
  var blockH = fit.lines.length * fit.size * 1.26;
  var startY = (CONTENT_H - blockH) / 2 - 30;

  drawLines(ctx, fit.lines, W / 2, startY, fit.size, 1.26, C.onDark, "center");

  if (card.sub) {
    drawParagraph(ctx, card.sub, W / 2, startY + blockH + 52, 36, 1.7, C.onDarkSub, "center", maxW - 120);
  }

  drawFooter(ctx, true);
}

function layoutLeftLine(ctx, card) {
  bgFill(ctx, C.white);

  ctx.fillStyle = C.green;
  ctx.fillRect(PAD, 300, 10, 460);

  var textX = PAD + 60;
  var maxW = W - textX - PAD;

  var fit = fitTitle(ctx, card.title, maxW, 4, 76, 50);
  drawLines(ctx, fit.lines, textX, 300, fit.size, 1.32, C.ink, "left");

  if (card.sub) {
    drawParagraph(ctx, card.sub, textX, 300 + fit.lines.length * fit.size * 1.32 + 48, 34, 1.75, C.gray, "left", maxW);
  }

  var items = (card.items || []).slice(0, 3);
  var listY = 800;
  for (var i = 0; i < items.length; i++) {
    ctx.fillStyle = C.green;
    ctx.beginPath();
    ctx.arc(PAD + 5, listY + i * 78 + 16, 7, 0, Math.PI * 2);
    ctx.fill();

    var f2 = fitTitle(ctx, items[i], maxW, 1, 36, 26);
    drawLines(ctx, f2.lines, textX, listY + i * 78, f2.size, 1.3, C.ink, "left");
  }

  drawFooter(ctx, false);
}

function layoutQuoteCenter(ctx, card) {
  bgFill(ctx, C.light);

  ctx.fillStyle = C.light2;
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.font = "700 260px " + FONT;
  ctx.fillText("\u201C", PAD - 10, 130);

  var maxW = W - PAD * 2 - 40;
  var fit = fitTitle(ctx, card.title, maxW, 4, 66, 44);
  var blockH = fit.lines.length * fit.size * 1.55;
  var startY = (CONTENT_H - blockH) / 2;

  drawLines(ctx, fit.lines, W / 2, startY, fit.size, 1.55, C.ink, "center");

  // 底部短横线，替代署名
  ctx.fillStyle = C.green;
  ctx.fillRect(W / 2 - 30, startY + blockH + 60, 60, 6);

  if (card.sub) {
    drawParagraph(ctx, card.sub, W / 2, startY + blockH + 100, 30, 1.7, C.gray, "center", maxW - 80);
  }

  drawFooter(ctx, false);
}

function layoutTimeline(ctx, card) {
  bgFill(ctx, C.white);

  ctx.fillStyle = C.ink;
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.font = "700 40px " + FONT;
  ctx.fillText(card.title || "", PAD, PAD);

  var items = (card.items || []).slice(0, 4);
  if (!items.length && card.sub) items = [card.sub];

  var top = 300;
  var step = items.length > 1 ? Math.min(190, (CONTENT_H - top - 140) / (items.length - 1)) : 0;
  var lineX = PAD + 20;

  if (items.length > 1) {
    ctx.strokeStyle = C.light2;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(lineX, top + 16);
    ctx.lineTo(lineX, top + (items.length - 1) * step + 16);
    ctx.stroke();
  }

  for (var i = 0; i < items.length; i++) {
    var y = top + i * step;
    ctx.fillStyle = C.green;
    ctx.beginPath();
    ctx.arc(lineX, y + 16, 11, 0, Math.PI * 2);
    ctx.fill();

    var f = fitTitle(ctx, items[i], W - PAD * 2 - 90, 2, 40, 28);
    drawLines(ctx, f.lines, lineX + 48, y - 2, f.size, 1.4, C.ink, "left");
  }

  drawFooter(ctx, false);
}

function layoutCoverPhoto(ctx, card, meta) {
  // 上半部当作配图区：用渐变与几何形代替图片
  var g = ctx.createLinearGradient(0, 0, W, 780);
  g.addColorStop(0, C.light2);
  g.addColorStop(1, C.light);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, 780);

  ctx.fillStyle = "rgba(22, 163, 74, 0.10)";
  ctx.beginPath();
  ctx.arc(W - 210, 210, 190, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "rgba(22, 163, 74, 0.16)";
  ctx.beginPath();
  ctx.arc(W - 330, 300, 96, 0, Math.PI * 2);
  ctx.fill();

  // 配图区顶部标签
  if (meta.theme) {
    ctx.fillStyle = C.green;
    roundedTag(ctx, PAD, PAD, meta.theme, 30);
  }

  // 下半部白底文字
  ctx.fillStyle = C.white;
  ctx.fillRect(0, 780, W, H - 780);

  var maxW = W - PAD * 2;
  var fit = fitTitle(ctx, card.title, maxW, 3, 84, 54);
  drawLines(ctx, fit.lines, PAD, 860, fit.size, 1.3, C.ink, "left");

  if (card.sub) {
    drawParagraph(ctx, card.sub, PAD, 860 + fit.lines.length * fit.size * 1.3 + 44, 34, 1.75, C.gray, "left", maxW);
  }

  drawFooter(ctx, false);
}

function roundedTag(ctx, x, y, text, size) {
  ctx.font = "600 " + size + "px " + FONT;
  var w = ctx.measureText(text).width + 44;
  var h = size + 30;
  ctx.fillStyle = C.white;
  roundRect(ctx, x, y, w, h, h / 2);
  ctx.fill();
  ctx.fillStyle = C.greenDeep;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.fillText(text, x + 22, y + h / 2);
}

var LAYOUT_FN = {
  "big-center": layoutBigCenter,
  "three-row": layoutThreeRow,
  "quad-grid": layoutQuadGrid,
  "dark-reverse": layoutDarkReverse,
  "left-line": layoutLeftLine,
  "quote-center": layoutQuoteCenter,
  "timeline": layoutTimeline,
  "cover-photo": layoutCoverPhoto
};

/* ---------------- 对外接口 ---------------- */

window.renderCard = function (json, meta) {
  currentCard = json || {};
  if (meta) currentMeta = meta;

  var canvas = getCanvas();
  var ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, W, H);

  var fn = LAYOUT_FN[currentCard.layout] || layoutBigCenter;
  fn(ctx, currentCard, currentMeta);

  return canvas;
};

window.downloadPng = function (fileName) {
  var canvas = getCanvas();
  var name = fileName || currentCard && currentCard.title || "card";
  name = String(name).replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 40);
  var url = canvas.toDataURL("image/png");
  var a = document.createElement("a");
  a.href = url;
  a.download = name + ".png";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
};

/* 父页面也可以通过 postMessage 传入卡片 */
window.addEventListener("message", function (ev) {
  var d = ev.data;
  if (d && d.type === "render-card" && d.card) {
    window.renderCard(d.card, d.meta);
  }
});

/* ---------------- 启动 ---------------- */

(function boot() {
  var params = new URLSearchParams(location.search);
  var raw = params.get("data");
  var meta = {
    theme: params.get("theme") || "",
    index: parseInt(params.get("i") || "1", 10),
    total: parseInt(params.get("n") || "1", 10)
  };

  var card = null;
  if (raw) {
    try {
      card = JSON.parse(raw);
    } catch (e) {
      try {
        card = JSON.parse(decodeURIComponent(raw));
      } catch (e2) {
        card = null;
      }
    }
  }

  if (card) {
    window.renderCard(card, meta);
    // 系统字体就绪后再画一次，避免首帧字体回退
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () {
        window.renderCard(card, meta);
      });
    }
  } else {
    document.getElementById("wrap").style.display = "none";
    var tip = document.getElementById("tip");
    tip.style.display = "block";
    tip.textContent = "缺少卡片数据。请通过 ?data=<JSON> 打开，或在父页面调用 renderCard()。";
  }
})();
</script>
</body>
</html>
